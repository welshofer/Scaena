[package]
name = "scaena-engine"
description = "Scaena engine: theme cascade, layout, text, charts, shaders, timeline resolution, sampling, display-list generation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["hyphenation"]
# The seventeen languages' hyphenation patterns compiled in (`hyphen`, ADR-0015): the CLI, the
# MCP server, and the player's module. The editor's module leaves them out, and its page hands a
# language's patterns over the first time a text hyphenates in it.
hyphenation = []

[dependencies]
scaena-core.workspace = true
serde.workspace = true
serde_json.workspace = true
indexmap.workspace = true
thiserror.workspace = true
# Text, layout, geometry (PLAN 0.1, ADR-0004). Versions and feature choices live in the workspace manifest.
parley.workspace = true
fontique.workspace = true
taffy.workspace = true
icu_segmenter.workspace = true
peniko.workspace = true
kurbo.workspace = true
libm.workspace = true
# Image content ids (`sha256:…`), as bundles name assets (SPEC §3.1).
sha2.workspace = true
# A font's OS/2 embedding bits, which lint reads (W230); parley reads fonts with the same
# skrifa. Tests also map characters to glyph ids through a font's own cmap.
skrifa.workspace = true

[dev-dependencies]
# What `hyphen` walks as: every language breaks every word where it does.
hypher.workspace = true
