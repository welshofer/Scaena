[package]
name = "scaena-mcp"
description = "MCP server over the operations every Scaena client exposes (rmcp). PLAN 1.17."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# deck_render with the GPU painter (PLAN 0.7).
gpu = ["scaena-ops/gpu"]

[dependencies]
# The syllable table compiled in (PLAN O.4a), so lint counts a haiku (I404).
scaena-core = { workspace = true, features = ["syllables"] }
# The themes that ship, by name, for `deck_create` (PLAN 2.13).
# Narrative health (PLAN G.9), whose measures are Narrato's.
# A picture too large for `image_add` made smaller (lift-up 10-24b FUNC-5).
scaena-ops = { workspace = true, features = ["shipped", "narrato", "smaller"] }
scaena-resources.workspace = true
scaena-objects.workspace = true
rmcp.workspace = true
tokio.workspace = true
base64.workspace = true
indexmap.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# Its hyphenation patterns and the code scanners' tables, which the tests' decks hyphenate and
# color by (ADR-0015, PLAN 2.132).
scaena-engine = { workspace = true, features = ["hyphenation", "code-tables"] }
rmcp = { workspace = true, features = ["client"] }
scaena-store.workspace = true
# A picture too large to take as it is, made for `image_add` to make smaller (lift-up 10-24b FUNC-5).
scaena-paint.workspace = true
