[package]
name = "scaena-mcp"
description = "MCP server over the operations every Scaena client exposes (rmcp). PLAN 1.17."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# deck_render with the GPU painter (PLAN 0.7).
gpu = ["scaena-ops/gpu"]

[dependencies]
scaena-core.workspace = true
# The themes that ship, by name, for `deck_create` (PLAN 2.13).
scaena-ops = { workspace = true, features = ["shipped"] }
scaena-resources.workspace = true
rmcp.workspace = true
tokio.workspace = true
base64.workspace = true
indexmap.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# Its hyphenation patterns, which the tests' decks hyphenate by (ADR-0015).
scaena-engine = { workspace = true, features = ["hyphenation"] }
rmcp = { workspace = true, features = ["client"] }
scaena-store.workspace = true
