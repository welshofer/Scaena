[package]
name = "scaena-wasm"
description = "wasm-bindgen bindings for the Scaena engine (browser player/editor). Phase 0 task 0.8."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["gpu", "cpu", "editor"]
# Paint with vello on WebGPU (PLAN 0.8), into a canvas or a worker's OffscreenCanvas (PLAN 2.1).
# Without it or `cpu`, the module is the engine alone: `frame()` returns display lists, and
# the page paints them some other way.
gpu = ["scaena-paint/gpu", "dep:vello", "dep:web-sys", "dep:wasm-bindgen-futures"]
# Paint with vello_cpu into RGBA pixels: the web player's fallback where WebGPU is missing
# (PLAN 2.1, SPEC §9.2).
cpu = ["scaena-paint/cpu"]
# The source editor (PLAN 2.3): compile `.scn`, lint with fixes, inspect, by `scaena-ops`'
# operations (ADR-0009). Its lint judges contrast over what the CPU painter paints. It opens
# and saves bundles in memory with `scaena-store` (PLAN 2.4), and starts new ones from a theme
# and its fonts, which the page hands over as a `Map` (PLAN 2.12).
editor = ["dep:scaena-ops", "dep:scaena-store", "dep:serde", "dep:indexmap", "dep:js-sys", "cpu"]

[dependencies]
scaena-core.workspace = true
scaena-engine.workspace = true
# Not the workspace entry: which painters the browser build carries is this crate's features.
scaena-paint = { path = "../scaena-paint", default-features = false }
scaena-ops = { workspace = true, optional = true }
scaena-store = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
indexmap = { workspace = true, optional = true }
serde_json.workspace = true
thiserror.workspace = true
wasm-bindgen.workspace = true
js-sys = { workspace = true, optional = true }
vello = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true, features = ["HtmlCanvasElement", "OffscreenCanvas", "console"] }

[dev-dependencies]
# What a page loads to record a save in a bundle's history (PLAN 2.9), called here as Rust.
scaena-history.workspace = true
