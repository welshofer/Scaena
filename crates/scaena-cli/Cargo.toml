[package]
name = "scaena-cli"
description = "The `scaena` command-line tool."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "scaena"
path = "src/main.rs"

[features]
# `scaena render --painter gpu`: vello on wgpu (PLAN 0.7). Off by default so the
# everyday build does not compile wgpu.
gpu = ["scaena-ops/gpu", "scaena-mcp/gpu", "scaena-paint/gpu"]

[dependencies]
scaena-core.workspace = true
scaena-engine.workspace = true
scaena-paint.workspace = true
scaena-export.workspace = true
scaena-store.workspace = true
scaena-ops.workspace = true
scaena-mcp.workspace = true
clap.workspace = true
miette.workspace = true
serde_json.workspace = true
anyhow.workspace = true

[[bench]]
# SPEC §15's stages on B1–B4 (PLAN 1.24): `cargo bench -p scaena-cli --features gpu --bench stages`.
name = "stages"
harness = false

[dev-dependencies]
criterion.workspace = true
sha2.workspace = true
rmcp = { workspace = true, features = ["client"] }
tokio = { workspace = true, features = ["process"] }
