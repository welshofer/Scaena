[package]
name = "scaena-cli"
description = "The `scaena` command-line tool."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "scaena"
path = "src/main.rs"

[features]
# `scaena render --painter gpu`: vello on wgpu (PLAN 0.7). Off by default so the
# everyday build does not compile wgpu.
gpu = ["scaena-paint/gpu"]

[dependencies]
scaena-core.workspace = true
scaena-engine.workspace = true
scaena-paint.workspace = true
scaena-export.workspace = true
scaena-store.workspace = true
clap.workspace = true
miette.workspace = true
serde_json.workspace = true
anyhow.workspace = true

[dev-dependencies]
sha2.workspace = true
