[package]
name = "scaena-paint"
description = "Scaena painters: vello (GPU) and vello_cpu (headless) consumers of the display list."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
scaena-core.workspace = true
thiserror.workspace = true
peniko.workspace = true
kurbo.workspace = true
png.workspace = true
vello_cpu = { workspace = true, optional = true }
bytemuck = { workspace = true, optional = true }
vello = { workspace = true, optional = true }

[dev-dependencies]
# The torture bundle's images by content id, as display lists name them.
sha2.workspace = true

[features]
default = ["cpu"]
# Headless, deterministic painter: CI, agents, export (PLAN 0.6).
cpu = ["dep:vello_cpu", "dep:bytemuck"]
# vello on wgpu: WebGPU in the browser, Metal on the Mac, Vulkan/GL on Linux (PLAN 0.7).
gpu = ["dep:vello"]
