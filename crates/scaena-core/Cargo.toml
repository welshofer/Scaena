[package]
name = "scaena-core"
description = "Scaena document model, state tracking, timeline math, display list types, document-level lints."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
indexmap.workspace = true
# Typed document views generate docs/schema/*.json (PLAN 1.1).
schemars.workspace = true
# The schemas' `pattern`s, when checking a document against them (PLAN 1.2).
regex-lite.workspace = true
thiserror.workspace = true
postcard.workspace = true
# Springs, color, poses, and palettes (SPEC §13.7): transcendental math that reads the same everywhere.
libm.workspace = true
# What is done pixel by pixel: each shader kind's CPU reference and WGSL twin, and the JPEG
# decoder, a crate of their own so the browser's modules build them for speed and the rest of
# core for size (PLAN 2.98).
scaena-pixels.workspace = true
