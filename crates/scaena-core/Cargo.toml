[package]
name = "scaena-core"
description = "Scaena document model, state tracking, timeline math, display list types, document-level lints."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["code-tables"]
# The word tables the code scanners read compiled in (`code::tables`, ADR-0029): natively, and in
# the player's module, which a single-file export carries offline. The editor's module leaves them
# out, and its page hands a scanner's tables over the first time a code text it colors lays out.
code-tables = []
# The table of English words the syllable rules miss, compiled in (`verse`, PLAN O.4a): the CLI,
# the MCP server, and the C ABI. The editor's module leaves it out and hands it over (ADR-0015).
syllables = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
indexmap.workspace = true
# Typed document views generate docs/schema/*.json (PLAN 1.1).
schemars.workspace = true
# The schemas' `pattern`s, when checking a document against them (PLAN 1.2).
regex-lite.workspace = true
thiserror.workspace = true
postcard.workspace = true
# The deck's words fenced as data in the writing tools' prompts (lift-up W1).
scaena-fence.workspace = true
# Springs, color, poses, and palettes (SPEC §13.7): transcendental math that reads the same everywhere.
libm.workspace = true
# What is done pixel by pixel: each shader kind's CPU reference and WGSL twin, and the JPEG
# decoder, a crate of their own so the browser's modules build them for speed and the rest of
# core for size (PLAN 2.98).
scaena-pixels.workspace = true

[dev-dependencies]
# Its own tests count with the table compiled in (`verse`).
scaena-core = { path = ".", features = ["syllables"] }

[build-dependencies]
# The schemas validation reads, compiled in without what it does not read (`build.rs`).
serde_json.workspace = true
