[package]
name = "scaena-ops"
description = "The operations every Scaena client exposes, over a bundle, with typed results (ADR-0009)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# Render with vello on the GPU (PLAN 0.7). Off by default so the everyday build does not
# compile wgpu.
gpu = ["scaena-paint/gpu", "scaena-export/gpu"]
# The themes that ship, with their fonts, in the binary, so `create` takes one by name
# (PLAN 2.13), and the icons that ship (PLAN 2.104). The CLI, the MCP server, and the C ABI
# carry them, every font compressed (PLAN T.0c); the browser's module does not, as the web build
# carries them beside its pages.
shipped = ["dep:flate2"]
# Decks made from a narrative Narrato writes (ADR-0026, PLAN G.1). Off in the browser's editor
# module, which loads generation as a module of its own (PLAN G.5).
narrato = ["dep:scaena-narrato", "dep:scaena-sources"]

[dependencies]
scaena-core.workspace = true
scaena-engine.workspace = true
scaena-paint.workspace = true
scaena-export.workspace = true
scaena-store.workspace = true
scaena-narrato = { workspace = true, optional = true }
scaena-sources = { workspace = true, optional = true }
base64.workspace = true
indexmap.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
flate2 = { workspace = true, optional = true }

# The shipped themes' fonts, found in the repository or the sha256 cache and compressed into the
# binary (PLAN T.0c, `build.rs`).
[build-dependencies]
flate2.workspace = true
sha2.workspace = true

[dev-dependencies]
# Its hyphenation patterns and the code scanners' tables, which the tests' decks hyphenate and
# color by (ADR-0015, PLAN 2.132).
scaena-engine = { workspace = true, features = ["hyphenation", "code-tables"] }
# The syllable table compiled in (PLAN O.4a).
scaena-core = { workspace = true, features = ["syllables"] }
hayro.workspace = true
# Rasterizes SVGs to compare with the painters (PLAN 1.21). Without its text feature: an
# SVG's text is the transparent layer a reader selects, which no painter draws.
resvg.workspace = true
