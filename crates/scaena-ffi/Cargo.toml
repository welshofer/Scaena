[package]
name = "scaena-ffi"
description = "The session the browser edits, as a C ABI (cbindgen) for the Swift client (PLAN 3.1, ADR-0021)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
# With the bundle a deck made from a prompt becomes (PLAN G.6).
scaena-session = { workspace = true, features = ["generate", "shipped"] }
# Narrato's requests and answers, the sources read, and the theme a deck is made in (PLAN G.6).
scaena-narrato.workspace = true
scaena-sources.workspace = true
# A map from Geoapify, by the plan Swift runs with URLSession (ADR-0030, PLAN O.1d).
scaena-objects.workspace = true
# The syllable table compiled in (PLAN O.4a), so lint counts a haiku (I404).
scaena-core = { workspace = true, features = ["syllables"] }
# The CRDT a save records the history in, and the subsetter a save shrinks fonts with: what the
# browser loads as modules of their own (scaena-history, scaena-subset), linked in here.
scaena-store.workspace = true
# Every language's hyphenation patterns and the code scanners' tables compiled in, as natively
# everywhere (ADR-0015, PLAN 2.132).
scaena-engine = { workspace = true, features = ["hyphenation", "code-tables"] }
serde_json.workspace = true
# A frame's pixels, as the painters give them.
scaena-paint.workspace = true
# The themes that ship and their fonts, which a new deck starts from (PLAN 2.12, 3.3).
scaena-ops = { workspace = true, features = ["shipped", "narrato"] }
# The assistant's conversation (PLAN 3.6, ADR-0022), what its model reads, and a frame it drew
# sent as a PNG in base64.
scaena-chat.workspace = true
scaena-resources.workspace = true
base64.workspace = true
# The PDF drawn from the pages the session lays out, as the browser's PDF module draws it (PLAN 3.8).
scaena-export.workspace = true

# vello on Metal, painting onto a CAMetalLayer (PLAN 3.2): the Mac's alone.
[target.'cfg(target_vendor = "apple")'.dependencies]
scaena-paint = { workspace = true, features = ["gpu"] }

[dev-dependencies]
# Writes `include/scaena.h` from this crate's code, which the `header` test holds it to.
cbindgen.workspace = true
