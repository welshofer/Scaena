[package]
name = "scaena-ffi"
description = "The session the browser edits, as a C ABI (cbindgen) for the Swift client (PLAN 3.1, ADR-0021)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
scaena-session.workspace = true
# The CRDT a save records the history in, and the subsetter a save shrinks fonts with: what the
# browser loads as modules of their own (scaena-history, scaena-subset), linked in here.
scaena-store.workspace = true
# Every language's hyphenation patterns compiled in, as natively everywhere (ADR-0015).
scaena-engine = { workspace = true, features = ["hyphenation"] }
serde_json.workspace = true
# A frame's pixels, as the painters give them.
scaena-paint.workspace = true
# The themes that ship and their fonts, which a new deck starts from (PLAN 2.12, 3.3).
scaena-ops = { workspace = true, features = ["shipped"] }
# The assistant's conversation (PLAN 3.6, ADR-0022), what its model reads, and a frame it drew
# sent as a PNG in base64.
scaena-chat.workspace = true
scaena-resources.workspace = true
base64.workspace = true

# vello on Metal, painting onto a CAMetalLayer (PLAN 3.2): the Mac's alone.
[target.'cfg(target_vendor = "apple")'.dependencies]
scaena-paint = { workspace = true, features = ["gpu"] }

[dev-dependencies]
# Writes `include/scaena.h` from this crate's code, which the `header` test holds it to.
cbindgen.workspace = true
# Reads back a frame's display list, as a Swift painter will.
scaena-core.workspace = true
