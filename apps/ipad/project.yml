# The iPad client's Xcode project (PLAN 4.1, 4.2, ADR-0023), made by XcodeGen and kept out of the
# repository. The app is the Mac app's own sources, built for the iPad; `apps/ipad/engine.sh`
# builds the engine for what Xcode builds, from a build phase of each target, and writes
# `Engine.xcconfig`: where the engine's static library is, and the system libraries it links.
# `just ipad` makes the project and opens it; `just ipad-test` runs ScaenaKit's tests and the app's
# on an iPad simulator.
name: Scaena
options:
  bundleIdPrefix: com.scaena
  deploymentTarget:
    iOS: "26.0"
configFiles:
  Debug: Engine.xcconfig
  Release: Engine.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "2"
packages:
  ScaenaKit:
    path: ../mac/ScaenaKit
targets:
  # Scaena on the iPad: the Mac app's sources, each AppKit piece behind `os(macOS)` with a UIKit
  # twin (PLAN 4.2). Named apart from ScaenaKit's own `Scaena`, the Mac's executable, which a test
  # host of the same name is taken for; the iPad shows it as Scaena (`CFBundleDisplayName`).
  ScaenaApp:
    type: application
    platform: iOS
    sources:
      - path: ../mac/ScaenaKit/Sources/Scaena
    dependencies:
      - package: ScaenaKit
        product: ScaenaKit
      - package: ScaenaKit
        product: ScaenaRemote
    preBuildScripts:
      - name: Engine
        script: |
          "$SRCROOT/engine.sh" "$([ "$PLATFORM_NAME" = iphoneos ] && echo device || echo sim)" "$([ "$CONFIGURATION" = Release ] && echo release || echo debug)"
        basedOnDependencyAnalysis: false
    settings:
      base:
        # The Mac app's language mode, as its package builds it.
        SWIFT_VERSION: "5.0"
        INFOPLIST_FILE: Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.welshofer.Scaena
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: NO
  # The remote on an iPhone or an iPad (PLAN 4.10): a show a Mac or an iPad presents, played from
  # across the room. It holds no deck and no engine, only ScaenaKit's remote.
  RemoteApp:
    type: application
    platform: iOS
    sources:
      - path: Remote
    dependencies:
      - package: ScaenaKit
        product: ScaenaRemote
    settings:
      base:
        SWIFT_VERSION: "5.0"
        INFOPLIST_FILE: Remote/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.welshofer.Scaena.Remote
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
  # The app as someone opens it, driven by XCUITest (PLAN 4.2): `apps/ipad/app-test.sh` runs it.
  ScaenaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ScaenaUITests
    dependencies:
      - target: ScaenaApp
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.scaena.ScaenaUITests
        TEST_TARGET_NAME: ScaenaApp
  # What hosts gate 4's tests on an iPad, which runs no test bundle without an app (docs/gate-4.md):
  # an app that does nothing, so that the tests time the engine alone.
  GateHost:
    type: application
    platform: iOS
    sources:
      - path: GateHost
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.welshofer.Scaena.GateHost
        CODE_SIGN_STYLE: Automatic
  # Gate 4's tests of its first two criteria (`apps/ipad/gate.sh`, docs/gate-4.md), hosted by the
  # app above. What they open goes in the bundle, since an iPad reaches none of the Mac's files: B1,
  # the torture deck, and its goldens' digests. The simulator reads the same copies.
  ScaenaGateTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ../mac/ScaenaKit/Tests/ScaenaKitTests/GateTests.swift
      - path: ../mac/ScaenaKit/Tests/ScaenaKitTests/Repository.swift
      - path: ../../tests/bench/b1.scaena
        type: folder
        buildPhase: resources
      - path: ../../tests/fixtures/torture.scaena
        type: folder
        buildPhase: resources
      - path: ../../tests/golden/torture/raw.fnv1a
        buildPhase: resources
    dependencies:
      - target: GateHost
      - package: ScaenaKit
        product: ScaenaKit
    preBuildScripts:
      - name: Engine
        script: |
          "$SRCROOT/engine.sh" "$([ "$PLATFORM_NAME" = iphoneos ] && echo device || echo sim)" "$([ "$CONFIGURATION" = Release ] && echo release || echo debug)"
        basedOnDependencyAnalysis: false
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.welshofer.Scaena.GateTests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/GateHost.app/GateHost
        BUNDLE_LOADER: $(TEST_HOST)
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGN_STYLE: Automatic
  # The Mac's tests of ScaenaKit, on the iPad: all but those of AppKit's views.
  ScaenaKitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ../mac/ScaenaKit/Tests/ScaenaKitTests
    dependencies:
      - package: ScaenaKit
        product: ScaenaKit
      - package: ScaenaKit
        product: ScaenaRemote
    preBuildScripts:
      - name: Engine
        script: |
          "$SRCROOT/engine.sh" "$([ "$PLATFORM_NAME" = iphoneos ] && echo device || echo sim)" "$([ "$CONFIGURATION" = Release ] && echo release || echo debug)"
        basedOnDependencyAnalysis: false
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.scaena.ScaenaKitTests
        ENABLE_USER_SCRIPT_SANDBOXING: NO
schemes:
  ScaenaApp:
    build:
      targets:
        ScaenaApp: all
        # The remote, built with the app, so that CI compiles it (PLAN 4.10).
        RemoteApp: all
        ScaenaUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ScaenaUITests
    archive:
      config: Release
  ScaenaKitTests:
    build:
      targets:
        ScaenaKitTests: [test]
    test:
      targets:
        - ScaenaKitTests
  # Gate 4's readings (`apps/ipad/gate.sh`): its tests alone, in the configuration asked for.
  ScaenaGate:
    build:
      targets:
        ScaenaGateTests: [test]
    test:
      targets:
        - ScaenaGateTests
