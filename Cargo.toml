[workspace]
resolver = "3"
members = [
  "crates/scaena-core",
  "crates/scaena-pixels",
  "crates/scaena-engine",
  "crates/scaena-paint",
  "crates/scaena-export",
  "crates/scaena-store",
  "crates/scaena-ops",
  "crates/scaena-session",
  "crates/scaena-cli",
  "crates/scaena-mcp",
  "crates/scaena-serve",
  "crates/scaena-wasm",
  "crates/scaena-subset",
  "crates/scaena-history",
  "crates/scaena-resources",
  "crates/scaena-pdf",
  "crates/scaena-ffi",
  "crates/scaena-chat",
]
default-members = [
  "crates/scaena-core",
  "crates/scaena-pixels",
  "crates/scaena-engine",
  "crates/scaena-paint",
  "crates/scaena-export",
  "crates/scaena-store",
  "crates/scaena-ops",
  "crates/scaena-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "UNLICENSED"
repository = "https://github.com/welshofer/Scaena"
authors = ["Jay Welshofer"]

[workspace.dependencies]
# internal
scaena-core   = { path = "crates/scaena-core" }
scaena-pixels = { path = "crates/scaena-pixels" }
# Without its hyphenation patterns, which the editor's module leaves out (ADR-0015): a crate
# that lays out natively asks for them.
scaena-engine = { path = "crates/scaena-engine", default-features = false }
scaena-paint  = { path = "crates/scaena-paint" }
scaena-export = { path = "crates/scaena-export" }
scaena-store  = { path = "crates/scaena-store" }
scaena-ops    = { path = "crates/scaena-ops" }
scaena-session = { path = "crates/scaena-session" }
scaena-mcp    = { path = "crates/scaena-mcp" }
scaena-serve  = { path = "crates/scaena-serve" }
scaena-resources = { path = "crates/scaena-resources" }
scaena-history = { path = "crates/scaena-history" }
scaena-chat   = { path = "crates/scaena-chat" }

# serialization / schema
serde      = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
schemars   = { version = "1.2", features = ["indexmap2", "preserve_order"] }
regex-lite = "0.1"
jsonschema = "0.58"
indexmap   = { version = "2.14", features = ["serde"] }
postcard   = { version = "1.1", features = ["alloc"] }

# errors / diagnostics
thiserror = "2.0"
anyhow    = "1.0"
miette    = { version = "7.6", default-features = false, features = ["fancy-no-backtrace"] }

# cli
clap = { version = "4.6", features = ["derive"] }

# text + layout + geometry (Linebender). Resolved versions are recorded in ADR-0004; Cargo.lock is the pin
# (CI runs --locked). parley 0.11 shapes with harfrust and reads fonts with skrifa; it does not use swash.
# `system` is off for parley and fontique: the render path must not be able to see system fonts (SPEC §13.3).
parley   = { version = "0.11.1", default-features = false, features = ["std"] }
fontique = { version = "0.11.1", default-features = false, features = ["std"] }
skrifa   = { version = "0.44.0", default-features = false, features = ["std"] } # same minor as parley/vello
taffy    = { version = "0.14.0", default-features = false, features = ["std", "taffy_tree", "flexbox", "grid", "detailed_layout_info"] }
# Hyphenation by `lang` (PLAN 1.8): TeX patterns under permissive licenses (LPPL, MPL, MIT, BSD-3),
# embedded as tries. Seventeen languages; about 340 KB of the WASM engine, gzipped.
hypher   = { version = "0.1.8", default-features = false, features = ["alloc", "english", "german", "french", "spanish", "italian", "portuguese", "dutch", "swedish", "danish", "finnish", "polish", "czech", "russian", "ukrainian", "turkish", "greek", "catalan"] }
peniko   = "0.6.1"
kurbo    = "0.13.1"
# Grapheme clusters, where a caret stands in a text (ADR-0013): parley's own segmenter, with its compiled
# data. Already in the graph through parley.
icu_segmenter = { version = "2.3.0", default-features = false, features = ["compiled_data"] }
# Pure-Rust cbrt/pow for color interpolation: the same bits on every platform, unlike the platform
# math library behind f32::cbrt and f32::powf (SPEC §13). Already in the graph through the painters.
libm     = "0.2.16"

# painters
vello     = "0.10.0"
vello_cpu = "0.2.0"
# A shader's bytes and a frame's pixels as vello_cpu's pixels and back, in the same buffer. Already in
# the graph through peniko.
bytemuck  = { version = "1.25", features = ["extern_crate_alloc"] }
# wgpu: use the version vello re-exports (`vello::wgpu`); do not pin separately.

# bundle I/O (PLAN 1.4): `.scaena` zips with pure-Rust deflate; fontations' subsetter (hb-subset's
# Rust port, formerly klippa), which keeps layout tables, variations, and hinting; sha256 for content
# addressing. skera reads fonts with its own, newer skrifa; the render path keeps the pinned one above.
zip   = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
skera = "0.7.0"
write-fonts = { version = "0.53.0", default-features = false, features = ["read"] } # skera's, for its input types
sha2  = "0.10"

# export
krilla = { version = "0.8.2", default-features = false, features = ["raster-images"] } # no `simple-text`: we never shape here
hayro  = { version = "0.7.1", default-features = false } # tests only: rasterizes PDFs to compare with the painters
resvg  = { version = "0.48.1", default-features = false, features = ["raster-images"] } # tests only: rasterizes SVGs to compare with the painters
png    = "0.18.1"
image  = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# data
csv = "1.4"

# store
loro = "1.16"
# The Mac's C header, made from scaena-ffi's code (PLAN 3.1): a test's dependency, not the library's.
cbindgen = { version = "0.29.4", default-features = false }

# agent surface
rmcp   = { version = "3.5", default-features = false, features = ["server", "macros", "schemars", "transport-io"] }
tokio  = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "sync", "time"] }
base64 = "0.23"
# Gzip for a single-file HTML export's files (PLAN 2.5), on the backend zip already builds.
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
# `scaena serve` (PLAN 2.11, ADR-0012): HTTP/1.1 on the tokio the MCP server already runs on.
hyper          = { version = "1.11", default-features = false, features = ["server", "http1"] }
hyper-util     = { version = "0.1.21", default-features = false, features = ["tokio"] }
http-body-util = "0.1.5"
bytes          = "1.12"

# benchmarks (SPEC §15, PLAN 1.24): no plots, no rayon; `cargo bench` runs them
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

# wasm / ffi (versions as Cargo.lock already resolves them through wgpu)
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = "0.3.106"
js-sys = "0.3.106"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = true

# The font subsetter, which a page loads only to download a bundle (PLAN 2.4), built for size:
# its module is 244 KB gzipped, against 296 KB at opt-level 3.
[profile.release.package.skera]
opt-level = "s"
[profile.release.package.write-fonts]
opt-level = "s"

# The WASM modules (`just wasm`): release's, with what runs as a deck is read, edited, or saved,
# not each frame, built for size, so the editor's module keeps within SPEC §15's 3.0 MB: 87 KB
# less gzipped than at opt-level 3, and B1's frames paint as fast. Release's overrides carry over.
[profile.wasm]
inherits = "release"
[profile.wasm.package.scaena-ops]
opt-level = "z"
# Core is the document, its tracking, patches, validation, and lint: built for size, the editor's
# module is 255 KB less gzipped, and B1's compile and lint take half again as long in Chromium
# (12.5 ms to lint a state). What is done pixel by pixel, the shaders and the JPEG decoder, is
# `scaena-pixels`, built at opt-level 3, as fast as before (PLAN 2.98).
[profile.wasm.package.scaena-core]
opt-level = "z"
[profile.wasm.package.scaena-store]
opt-level = "z"
# Layout, shaping, and the Unicode tables they read run as a deck is laid out, never as a frame
# samples it (SPEC §5): built for size, 68 KB less gzipped (PLAN 2.91).
[profile.wasm.package.taffy]
opt-level = "z"
[profile.wasm.package.parley]
opt-level = "z"
[profile.wasm.package.harfrust]
opt-level = "z"
[profile.wasm.package.fontique]
opt-level = "z"
[profile.wasm.package.icu_segmenter]
opt-level = "z"
[profile.wasm.package.icu_properties]
opt-level = "z"
[profile.wasm.package.icu_normalizer]
opt-level = "z"
[profile.wasm.package.icu_collections]
opt-level = "z"
[profile.wasm.package.icu_locale_core]
opt-level = "z"
# What links the module: Cargo strips its symbols only where its own override says so.
[profile.wasm.package.scaena-wasm]
opt-level = "z"
strip = true
# The session the module wraps (ADR-0021), built as it was inside `scaena-wasm`.
[profile.wasm.package.scaena-session]
opt-level = "z"
[profile.wasm.package.serde_json]
opt-level = "z"
[profile.wasm.package.zip]
opt-level = "z"
[profile.wasm.package.png]
opt-level = "z"
[profile.wasm.package.zlib-rs]
opt-level = "z"
[profile.wasm.package.fdeflate]
opt-level = "z"
[profile.wasm.package.regex-lite]
opt-level = "z"

[profile.dev.package."*"]
opt-level = 1

# The raster diff (SPEC §13.5) walks every pixel of every golden frame, in the painter tests
# and the parity harness: unoptimized, the harness holds two of the browser's painters to the
# goldens in 88 s; at 2, in 11.
[profile.dev.package.scaena-paint]
opt-level = 2
