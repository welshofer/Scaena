[workspace]
resolver = "3"
members = [
  "crates/scaena-core",
  "crates/scaena-engine",
  "crates/scaena-paint",
  "crates/scaena-export",
  "crates/scaena-store",
  "crates/scaena-ops",
  "crates/scaena-cli",
  "crates/scaena-mcp",
  "crates/scaena-wasm",
  "crates/scaena-ffi",
]
default-members = [
  "crates/scaena-core",
  "crates/scaena-engine",
  "crates/scaena-paint",
  "crates/scaena-export",
  "crates/scaena-store",
  "crates/scaena-ops",
  "crates/scaena-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "UNLICENSED"
repository = "https://github.com/welshofer/Scaena"
authors = ["Jay Welshofer"]

[workspace.dependencies]
# internal
scaena-core   = { path = "crates/scaena-core" }
scaena-engine = { path = "crates/scaena-engine" }
scaena-paint  = { path = "crates/scaena-paint" }
scaena-export = { path = "crates/scaena-export" }
scaena-store  = { path = "crates/scaena-store" }
scaena-ops    = { path = "crates/scaena-ops" }
scaena-mcp    = { path = "crates/scaena-mcp" }

# serialization / schema
serde      = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
schemars   = { version = "1.2", features = ["indexmap2", "preserve_order"] }
regex-lite = "0.1"
jsonschema = "0.58"
indexmap   = { version = "2.14", features = ["serde"] }
postcard   = { version = "1.1", features = ["alloc"] }

# errors / diagnostics
thiserror = "2.0"
anyhow    = "1.0"
miette    = { version = "7.6", default-features = false, features = ["fancy-no-backtrace"] }

# cli
clap = { version = "4.6", features = ["derive"] }

# text + layout + geometry (Linebender). Resolved versions are recorded in ADR-0004; Cargo.lock is the pin
# (CI runs --locked). parley 0.11 shapes with harfrust and reads fonts with skrifa; it does not use swash.
# `system` is off for parley and fontique: the render path must not be able to see system fonts (SPEC §13.3).
parley   = { version = "0.11.1", default-features = false, features = ["std"] }
fontique = { version = "0.11.1", default-features = false, features = ["std"] }
skrifa   = { version = "0.44.0", default-features = false, features = ["std"] } # same minor as parley/vello
taffy    = { version = "0.14.0", default-features = false, features = ["std", "taffy_tree", "flexbox", "grid"] }
# Hyphenation by `lang` (PLAN 1.8): TeX patterns under permissive licenses (LPPL, MPL, MIT, BSD-3),
# embedded as tries. Seventeen languages; about 340 KB of the WASM engine, gzipped.
hypher   = { version = "0.1.8", default-features = false, features = ["alloc", "english", "german", "french", "spanish", "italian", "portuguese", "dutch", "swedish", "danish", "finnish", "polish", "czech", "russian", "ukrainian", "turkish", "greek", "catalan"] }
peniko   = "0.6.1"
kurbo    = "0.13.1"
# Pure-Rust cbrt/pow for color interpolation: the same bits on every platform, unlike the platform
# math library behind f32::cbrt and f32::powf (SPEC §13). Already in the graph through the painters.
libm     = "0.2.16"

# painters
vello     = "0.10.0"
vello_cpu = "0.2.0"
# wgpu: use the version vello re-exports (`vello::wgpu`); do not pin separately.

# bundle I/O (PLAN 1.4): `.scaena` zips with pure-Rust deflate; fontations' subsetter (hb-subset's
# Rust port, formerly klippa), which keeps layout tables, variations, and hinting; sha256 for content
# addressing. skera reads fonts with its own, newer skrifa; the render path keeps the pinned one above.
zip   = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
skera = "0.7.0"
write-fonts = { version = "0.53.0", default-features = false, features = ["read"] } # skera's, for its input types
sha2  = "0.10"

# export
krilla = { version = "0.8.2", default-features = false, features = ["raster-images"] } # no `simple-text`: we never shape here
hayro  = { version = "0.7.1", default-features = false } # tests only: rasterizes PDFs to compare with the painters
png    = "0.18.1"
image  = { version = "0.25", default-features = false, features = ["png"] }

# data
csv = "1.4"

# store
loro = "1.16"

# agent surface
rmcp   = { version = "3.5", default-features = false, features = ["server", "macros", "schemars", "transport-io"] }
tokio  = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
base64 = "0.23"

# wasm / ffi (versions as Cargo.lock already resolves them through wgpu)
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = "0.3.106"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = true

[profile.dev.package."*"]
opt-level = 1
