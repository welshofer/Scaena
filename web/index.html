<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scaena</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; background: #1d1c1a; color: #ddd; font: 14px system-ui, sans-serif; }
      /* At its own size where it fits, scaled down to fit where it does not. */
      #stage { display: block; margin: 0 auto; max-width: 100vw; max-height: calc(100vh - 40px); }
      p { margin: 0; padding: 8px 12px; height: 24px; }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <p>
      <select id="state" aria-label="State"></select>
      <select id="format" aria-label="Format"><option value="">own canvas</option></select>
      <span id="status" role="status">loading…</span>
    </p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
