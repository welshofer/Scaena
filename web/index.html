<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scaena</title>
  </head>
  <body>
    <canvas id="stage" aria-hidden="true"></canvas>
    <div class="bar">
      <button id="back" aria-label="Back">◀</button>
      <button id="on" aria-label="On">▶</button>
      <input id="scrub" type="range" min="0" max="0" step="any" value="0" aria-label="States" />
      <select id="state" aria-label="State"></select>
      <select id="format" aria-label="Format"><option value="">own canvas</option></select>
      <span id="status" role="status">loading…</span>
      <span id="offline" class="offline" hidden title="The site keeps every file it needs in this browser: it opens, plays, and edits with no network">Works offline</span>
      <output id="meter" aria-live="off" hidden></output>
      <button id="present" aria-label="Presenter view">Presenter</button>
      <button id="full" aria-label="Fullscreen">⛶</button>
      <a id="edit" href="editor.html">Edit</a>
    </div>
    <p id="served" class="served" role="alert" hidden></p>
    <section id="reading" class="reading" aria-live="polite" aria-label="The slide"></section>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
