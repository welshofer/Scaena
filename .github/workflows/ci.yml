name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      # --all-features type-checks the `gpu` painter (vello on wgpu: Metal on macOS, Vulkan/GL on Linux).
      # --locked: Cargo.lock is the pin for the text and rendering stack (ADR-0004).
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --locked --exclude scaena-paint
      # The painter tests print each torture state's raster delta from the goldens (blessed on
      # x86-64 AVX2), so every run records where this runner's SIMD path lands (ADR-0004).
      - run: cargo test -p scaena-paint --locked -- --nocapture
      # The engine and both painters must keep compiling for the browser (PLAN 0.1, 0.8).
      - run: cargo clippy -p scaena-engine -p scaena-paint --all-features --target wasm32-unknown-unknown --locked -- -D warnings
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema fonttools==4.66.1
      - run: python3 scripts/validate_schema.py .
      # Every character in the torture deck resolves through its role's bundle-font fallback chain (PLAN 0.2).
      - run: python3 scripts/build_torture_fonts.py --check
