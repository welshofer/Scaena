name: ci
# Every push gets the fast checks: Linux, the WASM build in Chromium, and the schemas. macOS (Metal,
# NEON against the x86-64 goldens) bills ten Linux minutes for each of its own, so it runs only where
# it decides something: a pull request ready for review (a draft cannot merge, so nothing reaches
# `main` without it), a release tag, a manual run, and once a week on `main`, which catches what the
# merges did between. A pull request that changes only prose skips the Rust and WASM jobs; the
# schemas, which also read the examples, always run.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  schedule:
    - cron: "23 7 * * 1"
concurrency:
  # A new push to a pull request supersedes its run; each push to `main` is checked in full.
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      os: ${{ steps.diff.outputs.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A pull request's merge commit and its base, its first parent.
          fetch-depth: 2
      # Prose is Markdown outside what the build and tests read: SPEC (served over MCP and checked
      # against the skills), the skills, the examples, and anything under crates/ or tests/.
      - id: diff
        env:
          MACOS: >-
            ${{ (github.event_name == 'pull_request' && !github.event.pull_request.draft)
            || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
            || github.event_name == 'schedule' }}
        run: |
          code=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            code=false
            for f in $(git diff --name-only HEAD^1 HEAD); do
              case "$f" in
                docs/SPEC.md | docs/examples/* | skills/* | crates/* | tests/*) code=true ;;
                *.md) ;;
                *) code=true ;;
              esac
            done
          fi
          if [ "$MACOS" = true ]; then os='["ubuntu-latest","macos-latest"]'; else os='["ubuntu-latest"]'; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "os=$os" >> "$GITHUB_OUTPUT"
          echo "Code changed: $code; runners: $os" | tee -a "$GITHUB_STEP_SUMMARY"
  rust:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.os) }}
    runs-on: ${{ matrix.os }}
    # A stalled GPU readback or test must fail the job, not hold a runner for six hours.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # The debug test binaries, built once without `gpu` and once with it, outgrow the Linux
      # runner's free disk since scaena-ops and scaena-mcp (PLAN 1.17): the linker dies with a bus
      # error. Drop preinstalled toolchains this job never uses.
      - if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      # --all-features type-checks the `gpu` painter (vello on wgpu: Metal on macOS, Vulkan/GL on Linux).
      # --locked: Cargo.lock is the pin for the text and rendering stack (ADR-0004).
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # Video export pipes its frames to ffmpeg (PLAN 1.21). Its tests skip without it; on Linux,
      # where it installs quickly, SCAENA_REQUIRE_FFMPEG makes a missing one a failure instead.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg && echo "SCAENA_REQUIRE_FFMPEG=1" >> "$GITHUB_ENV"
      - run: cargo test --workspace --locked --exclude scaena-paint
      # Painter and CLI tests with the `gpu` feature. They print each torture state's raster delta
      # from the CPU goldens (blessed on x86-64 AVX2): vello_cpu at this runner's SIMD level, and
      # vello on this runner's adapter: Metal on macOS, Mesa's lavapipe (software Vulkan) on Linux.
      # SCAENA_REQUIRE_GPU makes a missing adapter a failure, not a skip (PLAN 0.7, ADR-0004).
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers
      - run: cargo test -p scaena-paint -p scaena-cli --features gpu --locked -- --nocapture
        env:
          SCAENA_REQUIRE_GPU: "1"
      # Diff images from the parity harness and any rejected golden (PLAN 0.9).
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diffs-${{ matrix.os }}
          path: tests/golden/torture/actual/
          if-no-files-found: ignore
      # The engine, both painters, and the WASM bindings (whose WebGPU half exists only on wasm32)
      # must keep compiling for the browser (PLAN 0.1, 0.8).
      - run: cargo clippy -p scaena-engine -p scaena-paint -p scaena-wasm --all-features --target wasm32-unknown-unknown --locked -- -D warnings
  wasm:
    # PLAN 0.8: the engine as WASM in headless Chromium. Every torture state's display list must
    # hash to the native digest (tests/golden/torture/raw.fnv1a) and paint through WebGPU.
    # PLAN 2.1–2.2: the web player shows every torture frame, painted in its worker by WebGPU
    # and by the CPU painter, and its controls and presenter view work. PLAN 0.9: then the
    # parity harness compares the painters on every state: the vello_cpu goldens, vello on
    # lavapipe, vello on WebGPU in the browser, and the player's two.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # The CLI must match the wasm-bindgen version in Cargo.lock.
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - run: cargo build -p scaena-wasm --target wasm32-unknown-unknown --release --locked
      - run: wasm-bindgen --target web --out-dir crates/scaena-wasm/www/pkg target/wasm32-unknown-unknown/release/scaena_wasm.wasm
      # SPEC §15: the engine as WASM, without fonts, is at most 3.0 MB gzipped.
      - name: WASM size
        run: |
          wasm=crates/scaena-wasm/www/pkg/scaena_wasm_bg.wasm
          gz=$(gzip -9 -c "$wasm" | wc -c)
          echo "WASM engine: $(wc -c < "$wasm") bytes, $gz gzipped (SPEC §15: at most 3,000,000)" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$gz" -le 3000000
      - run: node crates/scaena-wasm/www/smoke.mjs
      # SPEC §15's cold start, recorded: B1's first frame after navigation, WebGPU on SwiftShader.
      - run: node crates/scaena-wasm/www/coldstart.mjs tests/bench/b1.scaena 5 | tee -a "$GITHUB_STEP_SUMMARY"
      - run: cd web && npm ci && npm run build
      - run: node web/smoke.mjs
      - run: node web/player.mjs
      - run: node web/editor.mjs
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers
      - run: cargo test -p scaena-paint --features gpu --test parity --locked -- --nocapture
        env:
          SCAENA_REQUIRE_GPU: "1"
          SCAENA_WEB_PNGS: ${{ github.workspace }}/target/wasm-smoke:${{ github.workspace }}/target/web-smoke/player-webgpu:${{ github.workspace }}/target/web-smoke/player-cpu
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: parity
          path: |
            tests/golden/torture/actual/
            target/wasm-smoke/
            target/web-smoke/
          if-no-files-found: ignore
  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema fonttools==4.66.1
      - run: python3 scripts/validate_schema.py .
      # Every character in the torture deck resolves through its role's bundle-font fallback chain (PLAN 0.2).
      - run: python3 scripts/build_torture_fonts.py --check
      # Every character in the benchmark decks maps in its role's own family (PLAN 0.14).
      - run: python3 scripts/build_bundle_fonts.py --check
      # B2 and B3 are what their generator writes (PLAN 1.24).
      - run: python3 scripts/build_bench_decks.py --check
      # The bench gate judges a pull request beside its base (PLAN 1.24).
      - run: python3 -m unittest discover -s scripts -p "test_*.py"
