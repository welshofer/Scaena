name: ci
# What runs, and when. A macOS minute bills as ten Linux ones, and the bench workflow times
# pull requests apart (bench.yml).
# - A draft pull request gets the fast checks, on Linux: fmt, clippy, the workspace's tests, and
#   the schemas. Its author has run `just check`, which covers them and more.
# - A pull request marked ready for review, and each push to it after that, runs everything on
#   Linux (the painters on lavapipe, the WASM engine in Chromium, the parity harness), and macOS
#   where the pull request touches what paints or builds differently there, each reason with its
#   own checks. What paints (the painters, the shaders, the goldens) runs the workspace's tests
#   and the painters on Metal, NEON against the x86-64 goldens. What builds the apps (the C ABI,
#   the Mac's and the iPad's sources, the shots script) runs the C ABI's tests, ScaenaKit, the Mac
#   app's window, and the iPad's job. The lockfile and this file are both. A manual run
#   (workflow_dispatch) runs everything.
# - `main` runs Linux in full on each push, a newer push cancelling an older run, and everything
#   once a week, which catches what the merges did between. A release tag runs everything.
# - A pull request that changes only prose skips the Rust and WASM jobs. The schemas, which also
#   read the examples, always run.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  schedule:
    - cron: "23 7 * * 1"
env:
  # Debug builds keep line tables only: a panic or backtrace still names its file and line, and
  # the test builds take about 40% less disk. With full debug info they outgrew the Linux runner's
  # 32 GB free once the web crates joined the workspace (PLAN 2.1–2.26): rustc died with "No space
  # left on device".
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
concurrency:
  # A newer push supersedes an older run of the same pull request, or of `main`. A tag's run, the
  # weekly run, and a manual one each finish.
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' && github.event_name == 'push' }}
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The pull request's draft state is read from the API (below).
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
      full: ${{ steps.diff.outputs.full }}
      os: ${{ steps.diff.outputs.os }}
      paint: ${{ steps.diff.outputs.paint }}
      app: ${{ steps.diff.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A pull request's merge commit and its base, its first parent.
          fetch-depth: 2
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          LABELED: ${{ contains(github.event.pull_request.labels.*.name, 'apple') }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          # Prose is Markdown outside what the build and tests read: SPEC and its parts under
          # docs/spec/ (served over MCP and to the editor's assistant, and checked against the
          # skills), the authoring guide (held to the code), the skills, the examples, and anything
          # under crates/ or tests/.
          code=true
          if [ "$EVENT" = pull_request ]; then
            code=false
            for f in $(git diff --name-only HEAD^1 HEAD); do
              case "$f" in
                docs/SPEC.md | docs/spec/* | docs/authoring.md | docs/examples/* | skills/* | crates/* | tests/*) code=true ;;
                *.md) ;;
                *) code=true ;;
              esac
            done
          fi
          # Whether the pull request is a draft now, not as the event that started this run said: a
          # push and Ready for review made together start two runs, and the later cancels the
          # earlier, so the push's run, whose event says draft, could leave a ready pull request
          # with the fast checks alone (#623, #628). The event's word stands where the API fails.
          if [ "$EVENT" = pull_request ] && now=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .draft 2>/dev/null); then
            DRAFT=$now
          fi
          # Everything on Linux, but for a draft.
          full=true
          if [ "$EVENT" = pull_request ] && [ "$DRAFT" = true ]; then full=false; fi
          # macOS at the checkpoints; on a ready pull request, only where it touches what can paint
          # or build differently there, or where it carries the `apple` label (read as the event
          # comes: a label added takes effect at the pull request's next push or ready_for_review).
          # Each reason runs its own checks there: what paints, the workspace's tests and the
          # painters on Metal; what builds the apps, the C ABI's tests, ScaenaKit, the Mac app's
          # window, and the iPad's job. Neither runs the other's: Swift alone leaves the workspace's
          # tests to Linux, and a golden alone leaves the apps as main has them.
          paint=false
          app=false
          reasons() {
            for f in $(git diff --name-only "$@"); do
              case "$f" in
                crates/scaena-paint/* | crates/scaena-pixels/* | crates/scaena-core/src/shader.rs | tests/golden/*) paint=true ;;
                crates/scaena-ffi/* | apps/mac/* | apps/ipad/* | scripts/shots.sh) app=true ;;
                Cargo.lock | .github/workflows/ci.yml) paint=true app=true ;;
              esac
            done
          }
          case "$EVENT" in
            schedule | workflow_dispatch) paint=true app=true ;;
            push) paint=$TAG app=$TAG ;;
            pull_request)
              if [ "$DRAFT" != true ]; then
                if [ "$LABELED" = true ]; then paint=true app=true; else reasons HEAD^1 HEAD; fi
              fi ;;
          esac
          if [ "$paint" = true ] || [ "$app" = true ]; then os='["ubuntu-latest","macos-latest"]'; else os='["ubuntu-latest"]'; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "os=$os" >> "$GITHUB_OUTPUT"
          echo "paint=$paint" >> "$GITHUB_OUTPUT"
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "Code changed: $code; everything on Linux: $full; runners: $os; on macOS, what paints: $paint, what builds the apps: $app" | tee -a "$GITHUB_STEP_SUMMARY"
  rust:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.os) }}
    runs-on: ${{ matrix.os }}
    # The Mac app's window is pushed to a branch of the pull request's own (scripts/shots.sh).
    permissions:
      contents: write
    # A stalled GPU readback or test must fail the job, not hold a runner for six hours. A run
    # with nothing in its cache, as the first after the cache's key changes, builds everything:
    # #103's took 39 minutes on Linux and 27 on macOS. A pull request's run on macOS restores
    # nothing, since only `main` saves and `main` runs Linux, so it builds everything each time:
    # #413's took 59 minutes, and #402's ran out of 60.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      # The debug test binaries, built once without `gpu` and once with it, outgrow the Linux
      # runner's free disk since scaena-ops and scaena-mcp (PLAN 1.17): the linker dies with a bus
      # error. Drop preinstalled toolchains this job never uses.
      - if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      # Saved from `main` only, which every pull request restores from: a pull request's own
      # caches would evict main's from the repository's 10 GB.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The fonts the shipped themes name that git does not hold, which scaena-ops' build
      # carries, from the cache the schema job keeps, fetched by sha256 where it lacks them
      # (PLAN T.0c). The build itself reaches no network.
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/scaena-fonts
          key: fonts-${{ hashFiles('scripts/build_bundle_fonts.py') }}
          restore-keys: fonts-
      - run: python3 scripts/build_bundle_fonts.py --fetch --shipped
      - run: cargo fmt --all -- --check
      # --all-features type-checks the `gpu` painter (vello on wgpu: Metal on macOS, Vulkan/GL on Linux).
      # --locked: Cargo.lock is the pin for the text and rendering stack (ADR-0004).
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # Video export pipes its frames to ffmpeg (PLAN 1.21). Its tests skip without it, as on a
      # draft; in a full run on Linux, where it installs quickly, SCAENA_REQUIRE_FFMPEG makes a
      # missing one a failure instead.
      # What apt fetched for ffmpeg on this runner's image, kept by scripts/apt-install.sh: its
      # lists and packages, restored from main's cache and installed with no mirror asked; saved
      # from main when a run had to fetch them (a mirror served ffmpeg at 23 kB/s on 2026-10-23).
      - if: runner.os == 'Linux' && needs.changes.outputs.full == 'true'
        id: ffmpeg_image
        run: echo "image=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - if: runner.os == 'Linux' && needs.changes.outputs.full == 'true'
        id: ffmpeg_kept
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/apt/ffmpeg
          key: apt-${{ github.job }}-ffmpeg-${{ steps.ffmpeg_image.outputs.image }}
      - if: runner.os == 'Linux' && needs.changes.outputs.full == 'true'
        run: SCAENA_APT_KEEP="$HOME/.cache/apt/ffmpeg" scripts/apt-install.sh ffmpeg && echo "SCAENA_REQUIRE_FFMPEG=1" >> "$GITHUB_ENV"
      - if: runner.os == 'Linux' && needs.changes.outputs.full == 'true' && github.ref == 'refs/heads/main' && steps.ffmpeg_kept.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/apt/ffmpeg
          key: apt-${{ github.job }}-ffmpeg-${{ steps.ffmpeg_image.outputs.image }}
      # On macOS, the workspace's tests where the pull request touches what paints; where it touches
      # only what builds the apps, the C ABI's own, whose Swift the steps after it test.
      - if: runner.os == 'Linux' || needs.changes.outputs.paint == 'true'
        run: cargo test --workspace --locked --exclude scaena-paint
      - if: runner.os == 'macOS' && needs.changes.outputs.paint != 'true'
        run: cargo test -p scaena-ffi --locked
      # The Mac's C ABI (PLAN 3.1, ADR-0021): from C on both runners, as `just ffi` runs it, with
      # the system libraries rustc names; and from Swift on macOS, where ScaenaKit's tests link the
      # same static library.
      - name: The C ABI from C
        run: |
          libs=$(cargo rustc -q --color never -p scaena-ffi --lib --crate-type staticlib --locked -- --print native-static-libs 2>&1 | sed -n 's/.*native-static-libs: //p')
          echo "SCAENA_FFI_LIBS=$libs" >> "$GITHUB_ENV"
          mkdir -p target/ffi
          cc -std=c11 -Wall -Wextra -Werror -I crates/scaena-ffi/include crates/scaena-ffi/tests/c/smoke.c target/debug/libscaena_ffi.a $libs -o target/ffi/smoke
          cd tests/bench/b1.scaena && ../../../target/ffi/smoke . $(find . -type f ! -name '.*' | sed 's|^\./||' | sort)
      - name: ScaenaKit, the C ABI from Swift
        if: runner.os == 'macOS' && needs.changes.outputs.app == 'true'
        run: |
          swift --version && xcrun --show-sdk-version
          flags=(-Xlinker -L"$PWD/target/debug")
          set -- $SCAENA_FFI_LIBS
          while [ $# -gt 0 ]; do
            case "$1" in
              -framework) flags+=(-Xlinker -framework -Xlinker "$2"); shift 2 ;;
              *) flags+=(-Xlinker "$1"); shift ;;
            esac
          done
          cd apps/mac/ScaenaKit
          swift build --build-tests "${flags[@]}"
          # The tests run under a watchdog: they take under a minute, so one still running after
          # twelve is stuck. Then the stack of every thread of every test process is printed, and
          # the step fails, rather than the job waiting out its timeout with nothing to show.
          swift test --skip-build "${flags[@]}" &
          tested=$!
          for _ in $(seq 720); do kill -0 "$tested" 2>/dev/null || break; sleep 1; done
          if kill -0 "$tested" 2>/dev/null; then
            echo "::error::ScaenaKit's tests were still running after 12 minutes: each test process's stacks follow"
            for pid in $(pgrep -f 'swiftpm-testing-helper|xctest|ScaenaKitPackageTests'); do
              echo "::group::$pid $(ps -o command= -p "$pid" | cut -c1-200)"
              sample "$pid" 3 -mayDie -file "$RUNNER_TEMP/sample-$pid.txt" >/dev/null 2>&1 || true
              cat "$RUNNER_TEMP/sample-$pid.txt" 2>/dev/null || echo "no sample"
              echo "::endgroup::"
            done
            pkill -9 -f 'swiftpm-testing-helper|xctest|ScaenaKitPackageTests' || true
            kill -9 "$tested" 2>/dev/null || true
            exit 1
          fi
          wait "$tested"
          swift build --product Scaena "${flags[@]}"
      # The app as someone opens it, the trails example in its window, pushed to the branch
      # `shots/pr-N-mac` beside the iPad's, where a reviewer without the run's artifacts fetches it
      # (scripts/shots.sh). Seen more than tested: the shots are pushed whatever the walk found, and
      # a check it makes that does not hold fails this step after them, not the job.
      - name: The Mac app's window
        if: runner.os == 'macOS' && github.event_name == 'pull_request' && needs.changes.outputs.app == 'true'
        continue-on-error: true
        run: |
          walked=0
          apps/mac/window.sh || walked=$?
          scripts/shots.sh target/mac/window/shots "pr-${{ github.event.pull_request.number }}-mac"
          exit "$walked"
      # Painter and CLI tests with the `gpu` feature. They print each torture state's raster delta
      # from the CPU goldens (blessed on x86-64 AVX2): vello_cpu at this runner's SIMD level, and
      # vello on this runner's adapter: Metal on macOS, Mesa's lavapipe (software Vulkan) on Linux.
      # SCAENA_REQUIRE_GPU makes a missing adapter a failure, not a skip (PLAN 0.7, ADR-0004).
      # A full run's, and on macOS where the pull request touches what paints.
      # Lavapipe, kept and restored as ffmpeg is above.
      - if: runner.os == 'Linux' && needs.changes.outputs.full == 'true'
        id: mesa_vulkan_drivers_image
        run: echo "image=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - if: runner.os == 'Linux' && needs.changes.outputs.full == 'true'
        id: mesa_vulkan_drivers_kept
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/apt/mesa-vulkan-drivers
          key: apt-${{ github.job }}-mesa-vulkan-drivers-${{ steps.mesa_vulkan_drivers_image.outputs.image }}
      - if: runner.os == 'Linux' && needs.changes.outputs.full == 'true'
        run: SCAENA_APT_KEEP="$HOME/.cache/apt/mesa-vulkan-drivers" scripts/apt-install.sh mesa-vulkan-drivers
      - if: runner.os == 'Linux' && needs.changes.outputs.full == 'true' && github.ref == 'refs/heads/main' && steps.mesa_vulkan_drivers_kept.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/apt/mesa-vulkan-drivers
          key: apt-${{ github.job }}-mesa-vulkan-drivers-${{ steps.mesa_vulkan_drivers_image.outputs.image }}
      - if: needs.changes.outputs.full == 'true' && (runner.os == 'Linux' || needs.changes.outputs.paint == 'true')
        run: cargo test -p scaena-paint -p scaena-cli --features gpu --locked -- --nocapture
        env:
          SCAENA_REQUIRE_GPU: "1"
      # Diff images from the parity harness and any rejected golden (PLAN 0.9).
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diffs-${{ matrix.os }}
          path: tests/golden/torture/actual/
          if-no-files-found: ignore
      # The engine, both painters, and the WASM bindings (whose WebGPU half exists only on wasm32)
      # must keep compiling for the browser (PLAN 0.1, 0.8). On Linux: what compiles for wasm32
      # is the same on either runner.
      - if: runner.os == 'Linux'
        run: cargo clippy -p scaena-engine -p scaena-paint -p scaena-session -p scaena-wasm -p scaena-subset -p scaena-history -p scaena-resources -p scaena-pdf -p scaena-generator --all-features --target wasm32-unknown-unknown --locked -- -D warnings
      # The player's engine alone, as a single-file export carries it (PLAN 2.5), and the engine
      # without its hyphenation patterns and code tables, as the editor's module leaves them out
      # (ADR-0015, PLAN 2.132).
      - if: runner.os == 'Linux'
        run: cargo clippy -p scaena-wasm --no-default-features --features gpu,cpu --target wasm32-unknown-unknown --locked -- -D warnings
  # ScaenaKit on an iPad simulator (PLAN 4.1, ADR-0023), wherever macOS runs for what builds the
  # apps: the engine built for the simulator, the Xcode project XcodeGen makes, and ScaenaKit's
  # tests run by xcodebuild on the newest iPad the runner's Xcode offers. Beside the macOS job, not
  # in it, so the two take their time together.
  ipad:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.app == 'true'
    runs-on: macos-latest
    # The UI tests' screenshots are pushed to a branch of the pull request's own (scripts/shots.sh).
    permissions:
      contents: write
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The fonts the shipped themes name that git does not hold, which scaena-ops' build
      # carries, from the cache the schema job keeps, fetched by sha256 where it lacks them
      # (PLAN T.0c). The build itself reaches no network.
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/scaena-fonts
          key: fonts-${{ hashFiles('scripts/build_bundle_fonts.py') }}
          restore-keys: fonts-
      - run: python3 scripts/build_bundle_fonts.py --fetch --shipped
      - run: brew install xcodegen && xcodegen --version && xcodebuild -version
      - run: apps/ipad/test.sh
      # Gate 4's command (docs/gate-4.md), on the simulator, so that it keeps working on an iPad:
      # its readings here, in debug and painted by the CPU painter, are not the gate's.
      - if: ${{ !cancelled() }}
        run: apps/ipad/gate.sh
      # The app as someone opens it (PLAN 4.2), whether or not ScaenaKit's tests passed.
      - if: ${{ !cancelled() }}
        run: apps/ipad/app-test.sh
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ipad-screenshots
          path: target/ipad/shots
          if-no-files-found: ignore
      # The same, on the branch `shots/pr-N-ipad`, for a reviewer without the run's artifacts.
      - if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        continue-on-error: true
        run: scripts/shots.sh target/ipad/shots "pr-${{ github.event.pull_request.number }}-ipad"
  wasm:
    # PLAN 0.8: the engine as WASM in headless Chromium. Every torture state's display list must
    # hash to the native digest (tests/golden/torture/raw.fnv1a) and paint through WebGPU.
    # PLAN 2.1–2.2: the web player shows every torture frame, painted in its worker by WebGPU
    # and by the CPU painter, and its controls and presenter view work. PLAN 2.5: a single-file
    # export plays from its address on disk with the network off. PLAN 0.9: then the parity
    # harness compares the painters on every state: the vello_cpu goldens, vello on lavapipe,
    # vello on WebGPU in the browser, the player's two, and the single file's. PLAN 2.3–2.4:
    # the editor edits, opens, saves, downloads, and takes dropped files. PLAN 2.7: the static
    # site plays, edits, and asks from a path under its host. PLAN 2.8: what a reader needs.
    # A full run's: a draft skips it.
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    # With nothing in its cache, #103's run passed every step, then ran out of 45 minutes while
    # saving the cache: its runner took twice as long over the browser tests as #88's. With its
    # cache, #88's took 29. With the walks added since, #445's took 48 and #497's 50, and #466's
    # ran out of 60 minutes in its last steps, every walk passed.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The fonts the shipped themes name that git does not hold, which scaena-ops' build
      # carries, from the cache the schema job keeps, fetched by sha256 where it lacks them
      # (PLAN T.0c). The build itself reaches no network.
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/scaena-fonts
          key: fonts-${{ hashFiles('scripts/build_bundle_fonts.py') }}
          restore-keys: fonts-
      - run: python3 scripts/build_bundle_fonts.py --fetch --shipped
      # The CLI must match the wasm-bindgen version in Cargo.lock: built once, then restored.
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-0.2.129-${{ runner.os }}-${{ runner.arch }}
      - run: wasm-bindgen --version 2>/dev/null | grep -q ' 0.2.129' || cargo install wasm-bindgen-cli --version 0.2.129 --locked --force
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - run: cargo build -p scaena-wasm -p scaena-subset -p scaena-history -p scaena-resources -p scaena-pdf -p scaena-generator --target wasm32-unknown-unknown --profile wasm --locked
      - run: wasm-bindgen --target web --out-dir crates/scaena-wasm/www/pkg target/wasm32-unknown-unknown/wasm/scaena_wasm.wasm
      - run: wasm-bindgen --target web --out-dir crates/scaena-subset/pkg target/wasm32-unknown-unknown/wasm/scaena_subset.wasm
      # The CRDT, which the editor loads to save a bundle that keeps a history (PLAN 2.9).
      - run: wasm-bindgen --target web --out-dir crates/scaena-history/pkg target/wasm32-unknown-unknown/wasm/scaena_history.wasm
      # What the assistant reads, which the editor loads the first time it is asked (PLAN 2.6).
      - run: wasm-bindgen --target web --out-dir crates/scaena-resources/pkg target/wasm32-unknown-unknown/wasm/scaena_resources.wasm
      # The PDF painter, which the editor loads the first time it exports a PDF (PLAN 2.54).
      - run: wasm-bindgen --target web --out-dir crates/scaena-pdf/pkg target/wasm32-unknown-unknown/wasm/scaena_pdf.wasm
      # The generator, which a worker of its own loads to make a deck from a prompt (PLAN G.5).
      - run: wasm-bindgen --target web --out-dir crates/scaena-generator/pkg target/wasm32-unknown-unknown/wasm/scaena_generator.wasm
      # The player's engine alone, which a single-file export carries (PLAN 2.5), with every
      # language's hyphenation patterns and the code scanners' tables, since its page plays offline
      # (ADR-0015, PLAN 2.132).
      - run: cargo build -p scaena-wasm --no-default-features --features gpu,cpu,hyphenation,code-tables --target wasm32-unknown-unknown --profile wasm --locked
      - run: wasm-bindgen --target web --out-dir crates/scaena-wasm/player target/wasm32-unknown-unknown/wasm/scaena_wasm.wasm
      # SPEC §15: the engine as WASM, without fonts, is at most 3.0 MB gzipped. The font
      # subsetter, which a page loads only to download a bundle, is recorded beside it.
      - name: WASM size
        run: |
          wasm=crates/scaena-wasm/www/pkg/scaena_wasm_bg.wasm
          gz=$(gzip -9 -c "$wasm" | wc -c)
          echo "WASM engine: $(wc -c < "$wasm") bytes, $gz gzipped (SPEC §15: at most 3,000,000)" | tee -a "$GITHUB_STEP_SUMMARY"
          subset=crates/scaena-subset/pkg/scaena_subset_bg.wasm
          echo "Font subsetter: $(wc -c < "$subset") bytes, $(gzip -9 -c "$subset" | wc -c) gzipped, loaded to download" | tee -a "$GITHUB_STEP_SUMMARY"
          history=crates/scaena-history/pkg/scaena_history_bg.wasm
          echo "History (the CRDT): $(wc -c < "$history") bytes, $(gzip -9 -c "$history" | wc -c) gzipped, loaded to save a bundle that keeps one" | tee -a "$GITHUB_STEP_SUMMARY"
          player=crates/scaena-wasm/player/scaena_wasm_bg.wasm
          echo "The player's engine, in a single-file export: $(wc -c < "$player") bytes, $(gzip -9 -c "$player" | wc -c) gzipped" | tee -a "$GITHUB_STEP_SUMMARY"
          read=crates/scaena-resources/pkg/scaena_resources_bg.wasm
          echo "What the assistant reads: $(wc -c < "$read") bytes, $(gzip -9 -c "$read" | wc -c) gzipped, loaded to ask" | tee -a "$GITHUB_STEP_SUMMARY"
          pdf=crates/scaena-pdf/pkg/scaena_pdf_bg.wasm
          echo "The PDF painter: $(wc -c < "$pdf") bytes, $(gzip -9 -c "$pdf" | wc -c) gzipped, loaded to export a PDF" | tee -a "$GITHUB_STEP_SUMMARY"
          generator=crates/scaena-generator/pkg/scaena_generator_bg.wasm
          echo "The generator: $(wc -c < "$generator") bytes, $(gzip -9 -c "$generator" | wc -c) gzipped, loaded to make a deck from a prompt" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$gz" -le 3000000
      - run: node crates/scaena-wasm/www/smoke.mjs
      # SPEC §15's cold start, recorded: B1's first frame after navigation, WebGPU on SwiftShader.
      - run: node crates/scaena-wasm/www/coldstart.mjs tests/bench/b1.scaena 5 | tee -a "$GITHUB_STEP_SUMMARY"
      - run: cd web && npm ci && npm run build
      - run: node web/smoke.mjs
      # Exports with a `scaena` built after the web build, which carries its single-file page.
      - run: node web/standalone.mjs
      - run: node web/player.mjs
      - run: node web/editor.mjs
      # The worker alone: a request with a source older than the latest edit's never sets the deck back.
      - run: node web/worker.mjs
      # A deck kept nowhere, New's or a prompt's, is not saved: kept in the copy, asked about (lift-up 10-24 REL-1).
      - run: node web/unkept.mjs
      # The preview as a canvas: select, drag, resize, and the keys, each a patch to undo (PLAN 2.31).
      - run: node web/canvas.mjs
      - run: node web/typing.mjs
      - run: node web/inspector.mjs
      # A slide's number and footer from the inspector: the deck's and a slide's say, each a patch (PLAN 2.103).
      - run: node web/furniture.mjs
      - run: node web/icons.mjs
      # The layouts a state may take, drawn and judged by lint, previewed and chosen (PLAN 2.92).
      - run: node web/suggest.mjs
      # Nodes inserted from the theme and the bundle, copied, and deleted, each a patch (PLAN 2.34).
      - run: node web/insert.mjs
      # A shape takes words: a double click types in them, and they go where it goes (PLAN 2.108).
      - run: node web/words.mjs
      # Two objects joined by an arrow that follows them, picked by its line (PLAN 2.109).
      - run: node web/connect.mjs
      # A text's lines drawn as a process, a cycle, or a hierarchy in its place (PLAN 2.110).
      - run: node web/diagram.mjs
      # A slide transition chosen in the inspector, a presentation app's, in plain words (PLAN 2.111).
      - run: node web/transition.mjs
      - run: node web/builds.mjs
      - run: node web/mask.mjs
      - run: node web/pen.mjs
      # An object's shadow from the inspector, the theme's by name (PLAN 2.115).
      - run: node web/shadow.mjs
      # An image's light and color from the inspector's sliders (PLAN 2.117).
      - run: node web/adjust.mjs
      # A key arms the canvas to draw; a drag draws over the cells it covers, a line the way it went (PLAN 2.48).
      - run: node web/draw.mjs
      # Lint's findings on the canvas, the strip's counts, and a fix taken from a mark (PLAN 2.49).
      - run: node web/findings.mjs
      # The layers: listed topmost first, a node selected, shown or hidden, and renamed (PLAN 2.50).
      - run: node web/layers.mjs
      # A node locked: the canvas passes over it, its keys leave it, and a right click or ⇧⌘L
      # unlocks it (PLAN 2.95).
      - run: node web/lock.mjs
      # A node turned on the canvas: its outline and handles drawn through its transform, the rotate handle, the inspector's angle, and typing in a turned text (PLAN 2.51).
      - run: node web/rotate.mjs
      # The clipboard: a node and what it holds copied, cut, and pasted, into this deck or another (PLAN 2.37).
      - run: node web/clipboard.mjs
      # What another app copied, pasted: a screenshot, a WebP as a PNG of it, a file copied, words
      # with a picture of them, and a sheet's cells as a data source and the table they were (PLAN 2.96).
      - run: node web/paste.mjs
      # Code pasted as code in its language, tidied; its chip; Copy Code and Paste as Text (PLAN 2.133).
      - run: node web/code.mjs
      # A chart and a table inserted from a data source, and what a chart reads chosen in the inspector (PLAN 2.41).
      - run: node web/charts.mjs
      # Several nodes at once: selected, moved, aligned, ordered, deleted, copied, and pasted, each a patch (PLAN 2.42).
      - run: node web/several.mjs
      # Group and ungroup: a group where the nodes stand, and taken apart to the deck as it was (PLAN 2.43).
      - run: node web/group.mjs
      # The cue under the preview: a motion's delay and duration dragged, a motion added, the ruler, Play (PLAN 2.44).
      - run: node web/cue.mjs
      # An image from the inspector: its focal point picked on it, its crop and fit, an image file dropped on it (PLAN 2.45).
      - run: node web/image.mjs
      # A picture too large for a slide: asked about, a smaller copy taken, a PNG as a PNG with its transparency (SPEC §3.3).
      - run: node web/pictures.mjs
      # The preview zoomed and panned: painted at the size shown, every pointer read through the view (PLAN 2.46).
      - run: node web/zoom.mjs
      # Find and replace across the deck's texts: each match shown, marked, and replaced where its text lives (PLAN 2.47).
      - run: node web/find.mjs
      # Characters selected in a text take a look: ⌘B, and a role or color from the inspector (PLAN 2.38).
      - run: node web/runs.mjs
      # A theme chosen in the editor: one that ships, or the bundle's own; refused with why (PLAN 2.39).
      - run: node web/theme.mjs
      # The state strip: thumbnails, and states added, moved, renamed, and removed (PLAN 2.35).
      - run: node web/strip.mjs
      # The light table: every slide in a grid, moved by a drag and Alt with an arrow, copied, and taken
      # out, one patch each, every state reading as it read (PLAN 2.97).
      - run: node web/slides.mjs
      - run: node web/storage.mjs
      # The editor started again after a panic in the engine, from the bundle's files as the worker
      # held them, so Save still works (lift-up STAB-2).
      - run: node web/panic.mjs
      # The recovery copy of what is not saved, kept in the browser and offered when the deck opens
      # again (lift-up REL-4).
      - run: node web/recovery.mjs
      # The assistant runs PLAN 1.19's agent loop against a scripted server for each provider (PLAN 2.6).
      - run: node web/assistant.mjs
      # The writing tools (PLAN 2.101): a text proofread, tightened, rewritten, a slide's notes
      # drafted, and an issue explained, by a scripted model, each taken or left.
      - run: node web/writing.mjs
      # A question carries what the editor shows, and what its patch changes is selected after it (PLAN 2.52).
      - run: node web/seeing.mjs
      - run: node web/commands.mjs
      # The state shown as a PNG, the deck as a PDF by its own module, and as one HTML file, each what
      # `scaena export` writes (PLAN 2.54).
      - run: node web/export.mjs
      # A data source as a table: a cell set, rows added and taken away, undone, and saved as
      # `scaena data` writes the file (PLAN 2.55).
      - run: node web/data.mjs
      # What a reader hears: a node's description and part chosen in the inspector, the state's
      # reading in order, and W410's mark opening the inspector on the image (PLAN 2.56).
      - run: node web/reader.mjs
      # Guides: the theme's grid of the format shown on request, and a line where a dragged box
      # meets another, which a move off the grid snaps to (PLAN 2.57).
      - run: node web/guides.mjs
      # A look copied from one node (⌥⌘C) and pasted on others (⌥⌘V), each written where its own
      # lives (PLAN 2.58).
      - run: node web/looks.mjs
      # The bundle's files, what uses each, an image dragged onto the canvas, and one nothing names
      # taken out and put back (PLAN 2.59).
      - run: node web/files.mjs
      # The deck's versions from its history: one shown as it was, compared, and restored with its
      # data file as one change, which undoes and records as any other (PLAN 2.60).
      - run: node web/versions.mjs
      # The deck's theme edited in its tab: colors, a role's size, each one edit undone with the
      # theme written back, and recorded by the user (PLAN 2.61).
      - run: node web/theme-edit.mjs
      # A theme's colors from a photo the bundle holds, by the Theme tab and a right click on the
      # photo, and ⌘Z taking them back (PLAN 2.94).
      - run: node web/theme-photo.mjs
      # The state shown in every format side by side, painted as a cue plays, each counting its
      # findings and opening the canvas in it (PLAN 2.62).
      - run: node web/formats.mjs
      # A rehearsal: each state's time kept, and kept as its hold in one patch, one step to undo
      # (PLAN 2.63).
      - run: node web/rehearse.mjs
      # A chart's marks and the rows of its data: a click on a bar chooses its row in the Data tab,
      # and a row chosen is outlined where it draws (PLAN 2.64).
      - run: node web/rows.mjs
      # ? shows every key the editor answers, by what it does, from the commands' own list (PLAN 2.65).
      - run: node web/keys.mjs
      # A chart annotated from its marks: a bar picked offers to highlight it, call it out, rule its
      # value, or band from it to another; a callout dragged to another bar, reworded, and deleted
      # (PLAN 2.67).
      - run: node web/annotate.mjs
      # A shape's points dragged, added at an edge's middle, and taken away with Delete, and a rect's
      # corner rounded to the theme's radius steps (PLAN 2.68).
      - run: node web/points.mjs
      # An image's crop and focal point dragged on the canvas, the whole image outlined (PLAN 2.74).
      - run: node web/crop.mjs
      # The canvas by keys alone: Tab in reading order, Enter into a container or onto a node's
      # handles, the arrows moving each, [ and ] turning, and a layout's slots (PLAN 2.75).
      - run: node web/bykeys.mjs
      # Lists in a text: Enter, Tab, Shift+Tab, ⌘⇧8, and ⌘⇧7 as a word processor's, and the
      # player reading the lists as lists (PLAN 2.69).
      - run: node web/lists.mjs
      # Links in a text: ⌘K links the characters selected, and the player follows a link to a
      # state or opens a web address (PLAN 2.70).
      - run: node web/links.mjs
      # A theme's layouts on the canvas: a slot dragged and resized onto the grid is one theme
      # edit, in each format; a layout copied for the state shown (PLAN 2.71).
      - run: node web/layouts.mjs
      # Copy that quotes data: a cell of the Data tab quoted in the characters selected, its
      # figure set again when the cell changes (PLAN 2.72).
      - run: node web/quotes.mjs
      # The editor records its saves in a bundle's history, by the CRDT's own module (PLAN 2.9).
      - run: node web/history.mjs
      # The pages on a bundle's folder, served by `scaena serve` (PLAN 2.11).
      - run: node web/live.mjs
      # The editor starts a deck from a theme that ships, and saves it somewhere new (PLAN 2.12).
      - run: node web/new.mjs
      # A deck made from a prompt, grounded in files and a page, Narrato played by a scripted
      # server: the generator's own module, and the deck opened in the editor (PLAN G.5).
      - run: node web/generate.mjs
      # A first deck as a person makes one, from New to a deck that plays, exports, and opens
      # again, by the editor's buttons, menus, keys, and drops alone (PLAN 2.76).
      - run: node web/first-deck.mjs
      # The static site with its demo deck (`just site`), served from a path under its host (PLAN 2.7).
      - run: cd web && VITE_BUNDLE=decks/trails/ npx vite build --outDir ../target/site --emptyOutDir
      - run: SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) cargo run -q -p scaena-cli --locked -- save docs/examples/trails.deck.json --to target/site/decks/trails --keep-fonts
      - run: node web/site.mjs
      # A deck edited as a person edits one, the site's demo deck by the editor's buttons, menus,
      # keys, and drops alone: re-themed, rearranged, restyled, its data and words changed,
      # rehearsed, presented, and exported (PLAN 2.77). It reads the site built above.
      - run: node web/edit-deck.mjs
      - run: node web/present-deck.mjs
      # The site installed, then used with no network: its service worker keeps every file (PLAN 2.73).
      - run: node web/offline.mjs
      # What a reader needs: axe-core finds nothing against WCAG 2.1 AA, the live region reads
      # as the single file does, less motion cuts, and the keys (PLAN 2.8).
      - run: node web/a11y.mjs
      # Lavapipe, kept and restored as the rust job keeps ffmpeg.
      - id: mesa_vulkan_drivers_image
        run: echo "image=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - id: mesa_vulkan_drivers_kept
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/apt/mesa-vulkan-drivers
          key: apt-${{ github.job }}-mesa-vulkan-drivers-${{ steps.mesa_vulkan_drivers_image.outputs.image }}
      - run: SCAENA_APT_KEEP="$HOME/.cache/apt/mesa-vulkan-drivers" scripts/apt-install.sh mesa-vulkan-drivers
      - if: github.ref == 'refs/heads/main' && steps.mesa_vulkan_drivers_kept.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/apt/mesa-vulkan-drivers
          key: apt-${{ github.job }}-mesa-vulkan-drivers-${{ steps.mesa_vulkan_drivers_image.outputs.image }}
      - run: cargo test -p scaena-paint --features gpu --test parity --locked -- --nocapture
        env:
          SCAENA_REQUIRE_GPU: "1"
          SCAENA_WEB_PNGS: ${{ github.workspace }}/target/wasm-smoke:${{ github.workspace }}/target/web-smoke/player-webgpu:${{ github.workspace }}/target/web-smoke/player-cpu:${{ github.workspace }}/target/web-smoke/standalone-cpu
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: parity
          path: |
            tests/golden/torture/actual/
            target/wasm-smoke/
            target/web-smoke/
            target/first-deck/
            target/edit-deck/
            target/present-deck/
          if-no-files-found: ignore
  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema fonttools==4.66.1
      - run: python3 scripts/validate_schema.py .
      # Every character in the torture deck resolves through its role's bundle-font fallback chain (PLAN 0.2).
      - run: python3 scripts/build_torture_fonts.py --check
      # The torture deck's test card is what its generator writes (PLAN 1.7), as `just schema` checks.
      - run: python3 scripts/build_torture_images.py --check
      # Every character in the benchmark decks maps in its role's own family (PLAN 0.14), and each
      # SOURCES.md answers for the files beside it (PLAN T.0b).
      - run: python3 scripts/build_bundle_fonts.py --check
      # Every family a theme names, fetched by sha256 into a cache CI keeps, then read from it
      # with no network (PLAN T.0b). A change to the table restores the last cache and fetches
      # only what it lacks.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/scaena-fonts
          key: fonts-${{ hashFiles('scripts/build_bundle_fonts.py') }}
          restore-keys: fonts-
      - run: python3 scripts/build_bundle_fonts.py --fetch
      - run: python3 scripts/build_bundle_fonts.py --fetch --offline
      # What a save keeps of a CJK font, and the tests' script fonts, are what their generator
      # writes and fetches (PLAN G.22).
      - run: python3 scripts/build_scripts.py --check
      # The lint fixtures' font is what its generator writes, its license bits and all (W230).
      - run: python3 scripts/build_lint_fonts.py --check
      # B2 and B3 are what their generator writes (PLAN 1.24).
      - run: python3 scripts/build_bench_decks.py --check
      # The decks that read right to left are what their generator writes (PLAN T.5a).
      - run: python3 scripts/build_rtl_decks.py --check
      # The shipped themes are what their specs write on the shared base, and the registry's tables what
      # it lists (PLAN T.0a, ADR-0031).
      - run: python3 scripts/build_themes.py --check
      # The shipped themes' layouts are what the library's generator writes (PLAN 3.31).
      - run: python3 scripts/build_layouts.py --check
      # The icons that ship are absolute paths in their view, as their generator writes them (PLAN 2.104).
      - run: python3 scripts/build_icons.py --check
      # The syllable table is what CMUdict and the Ngram ranks kept make, and the rules count as words/syllable does (PLAN O.4a).
      - run: python3 scripts/build_syllables.py --check
      # The Mac's and the iPad's app icons, and the iPad's accent, are what their generator writes.
      - run: python3 scripts/build_app_icon.py --check
      # The bench gate judges a pull request beside its base (PLAN 1.24).
      - run: python3 -m unittest discover -s scripts -p "test_*.py"
      # The browser's assistant still makes the exchanges recorded, which scaena-chat's tests hold
      # the Mac's to (PLAN 3.6, ADR-0022). Node reads the adapters' TypeScript, its types stripped.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --experimental-strip-types web/exchanges.mjs
      # The assistant's answers render as they read (narrative ATTR-4): the blocks and elements.
      - run: node --experimental-strip-types web/markdown.mjs
